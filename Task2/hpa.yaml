apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task2
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 30
